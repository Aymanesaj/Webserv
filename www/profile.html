<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webserv - Profile</title>
    <link rel="stylesheet" href="style/style.css">
    <style>
        :root {
            --bg: #0f172a;
            --bg-soft: #111b2e;
            --panel: rgba(15, 23, 42, 0.62);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-2: #22c55e;
            --border: rgba(148, 163, 184, 0.18);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 8% 0%, rgba(56, 189, 248, 0.16), transparent 38%),
                radial-gradient(circle at 92% 100%, rgba(34, 197, 94, 0.12), transparent 35%),
                var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
			width: min(1100px, 92%);
			margin: 0 auto;
		}

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

		header {
			padding: 26px 0;
			border-bottom: 1px solid var(--border);
			background: rgba(11, 18, 32, 0.75);
			backdrop-filter: blur(5px);
			position: sticky;
			top: 0;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
			font-weight: 700;
			letter-spacing: 0.3px;
		}

		.dot {
			width: 10px;
			height: 10px;
			border-radius: 999px;
			background: linear-gradient(135deg, var(--accent), var(--accent-2));
			box-shadow: 0 0 18px rgba(56, 189, 248, 0.7);
		}

        .profile-shell {
            width: min(1100px, 92%);
            margin: 34px auto 52px auto;
            display: grid;
            gap: 18px;
        }

        .profile-hero {
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(18, 28, 48, 0.9), rgba(18, 28, 48, 0.72));
            border-radius: 16px;
            padding: 30px;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 0.78rem;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .username {
            margin: 0;
            font-size: clamp(1.8rem, 5vw, 2.9rem);
            line-height: 1.1;
        }

        .subtitle {
            margin-top: 10px;
            margin-bottom: 0;
            color: var(--muted);
            max-width: 64ch;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .profile-item {
            border: 1px solid var(--border);
            background: var(--panel);
            border-radius: 12px;
            padding: 16px;
        }

        .profile-item h3 {
            margin: 0 0 8px 0;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .profile-item p {
            margin: 0;
            font-size: 1rem;
        }

        .logout-form {
            margin: 0;
        }

        .logout-btn {
            border: 1px solid rgba(248, 113, 113, 0.6);
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 0.92rem;
            font-weight: 700;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.25);
            cursor: pointer;
            transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .logout-btn:hover {
            border-color: rgba(248, 113, 113, 0.9);
            background: rgba(153, 27, 27, 0.45);
            color: #fee2e2;
        }

        .logout-btn:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.25);
        }
        a {
            color: var(--text);
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .profile-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 620px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }

            .profile-hero {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
	<header>
        <div class="container header-inner">
		    <div class="brand">
			    <span class="dot"></span>
                <a href="/"><span>Webserv</span></a>
		    </div>
            <form action="/logout" method="post" class="logout-form">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
	</header>

    <main class="profile-shell">
        <section class="profile-hero">
            <p class="eyebrow">Account Overview</p>
            <h1 class="username">{{USERNAME}}</h1>
            <p class="subtitle">Welcome back. This page is served by your session, so what you see here belongs to the current logged in user.</p>
        </section>

        <section class="profile-grid">
            <article class="profile-item">
                <h3>Role</h3>
                <p>Member</p>
            </article>
            <article class="profile-item">
                <h3>Status</h3>
                <p>Authenticated</p>
            </article>
            <article class="profile-item">
                <h3>Session</h3>
                <p>Active</p>
            </article>
        </section>
    </main>
</body>
</html>
